name: Whop Sandbox E2E

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'E2E run mode'
        required: false
        default: 'full_e2e'
        type: choice
        options:
          - full_e2e
          - verify_existing_payment
          - audit_qa_vars
          - repair_qa_vars
      cancel_duplicate_membership:
        description: 'Cancel old duplicate Sandbox membership mem_***1HNy'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: whop-sandbox-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout selected feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        if: github.event.inputs.mode == 'full_e2e'
        run: npx playwright install --with-deps chromium

      - name: Provision isolated Appwrite QA account
        id: provision
        if: github.event.inputs.mode == 'full_e2e' || github.event.inputs.mode == 'verify_existing_payment'
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          WISE_RESUME_E2E_EMAIL: ${{ secrets.WISE_RESUME_E2E_EMAIL }}
          WISE_RESUME_E2E_PASSWORD: ${{ secrets.WISE_RESUME_E2E_PASSWORD }}
          RUN_MODE: ${{ github.event.inputs.mode || 'full_e2e' }}
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const sdk = require('node-appwrite');
          const endpoint = process.env.APPWRITE_ENDPOINT;
          const projectId = process.env.APPWRITE_PROJECT_ID;
          const email = String(process.env.WISE_RESUME_E2E_EMAIL || '').trim().toLowerCase();
          const password = String(process.env.WISE_RESUME_E2E_PASSWORD || '');
          const apiKey = process.env.APPWRITE_API_KEY;
          const runMode = String(process.env.RUN_MODE || 'full_e2e');
          if (!email || !password || !apiKey) throw new Error('required Appwrite QA configuration is missing');
          (async () => {
            const client = new sdk.Client().setEndpoint(endpoint).setProject(projectId).setKey(apiKey);
            const users = new sdk.Users(client);
            let targetEmail = email;
            let user = null;
            if (runMode === 'full_e2e') {
              const stamp = Date.now().toString(36);
              const [localPart, domain] = email.split('@');
              targetEmail = `${localPart}+qa_${stamp}@${domain}`;
              user = await users.create(sdk.ID.unique(), targetEmail, undefined, password, 'WiseResume Whop Sandbox QA Fresh');
              await users.updateEmailVerification(user.$id, true);
              console.log('QA_USER_PROVISIONED=true mode=fresh');
            } else {
              const listed = await users.list([sdk.Query.equal('email', [email]), sdk.Query.limit(1)]);
              user = listed.users?.[0];
              if (!user) user = await users.create(sdk.ID.unique(), email, undefined, password, 'WiseResume Whop Sandbox QA');
              if (!user.emailVerification) await users.updateEmailVerification(user.$id, true);
              console.log('QA_USER_PROVISIONED=true mode=canonical');
            }
            const id = String(user.$id || '');
            if (!id) throw new Error('Appwrite did not return a QA user ID');
            process.stdout.write(`::add-mask::${id}\n`);
            process.stdout.write(`::add-mask::${targetEmail}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `qa_user_id=${id}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `qa_user_email=${targetEmail}\n`);
          })().catch(error => { console.error(`[qa-provision] ${error.message}`); process.exit(1); });
          NODE

      - name: Sync temporary Whop QA user variable
        id: sync_qa_vars
        if: github.event.inputs.mode == 'full_e2e'
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          TARGET_QA_USER_ID: ${{ steps.provision.outputs.qa_user_id }}
        run: node scripts/sync_whop_qa_user_variable.cjs capture-and-apply

      - name: Run Whop isolation and checkout tests
        if: github.event.inputs.mode == 'full_e2e' || github.event.inputs.mode == 'verify_existing_payment'
        run: node --test tests/hubs/whop-resolver.test.cjs tests/hubs/billing-checkout.test.cjs tests/hubs/coupons-subscription.test.cjs tests/hubs/whop-checkout.test.cjs

      - name: Build feature branch frontend
        if: github.event.inputs.mode == 'full_e2e'
        env:
          VITE_BILLING_PUBLIC_MODE: sandbox
          VITE_CHECKOUT_ENVIRONMENT: sandbox
          VITE_BILLING_ENVIRONMENT: sandbox
          VITE_WHOP_CHECKOUT_ENVIRONMENT: sandbox
        run: npm run build

      - name: Start feature-branch preview
        if: github.event.inputs.mode == 'full_e2e'
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/wiseresume-preview.log 2>&1 & echo $! > /tmp/wiseresume-preview.pid)
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/subscription > /dev/null; then exit 0; fi
            sleep 2
          done
          echo '[e2e] feature preview did not start' >&2
          exit 1

      - name: Run authenticated Whop Sandbox browser E2E
        if: github.event.inputs.mode == 'full_e2e'
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          WHOP_SANDBOX_API_KEY: ${{ secrets.WHOP_SANDBOX_API_KEY }}
          WISE_RESUME_E2E_EMAIL: ${{ steps.provision.outputs.qa_user_email || secrets.WISE_RESUME_E2E_EMAIL }}
          WISE_RESUME_E2E_PASSWORD: ${{ secrets.WISE_RESUME_E2E_PASSWORD }}
          QA_USER_ID: ${{ steps.provision.outputs.qa_user_id }}
          WHOP_ACCESS_ENVIRONMENT: sandbox
          WHOP_CHECKOUT_ENVIRONMENT: sandbox
          WHOP_SANDBOX_COMPANY_ID: biz_4To0HUTEuAbKkl
          WHOP_SANDBOX_PRODUCT_ID: prod_b7Vm6yYS2ROI6
          WHOP_SANDBOX_PRO_PLAN_ID: plan_ECWULjIBMFBE5
          WHOP_SANDBOX_PREMIUM_PLAN_ID: plan_YCBJ6FvCkKuRv
        run: node scripts/run-whop-sandbox-e2e.mjs

      - name: Run read-only post-payment verification
        if: github.event.inputs.mode == 'verify_existing_payment'
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          WHOP_SANDBOX_API_KEY: ${{ secrets.WHOP_SANDBOX_API_KEY }}
          WHOP_SANDBOX_QA_USER_ID: ${{ steps.provision.outputs.qa_user_id }}
          WHOP_ACCESS_ENVIRONMENT: sandbox
          WHOP_CHECKOUT_ENVIRONMENT: sandbox
          WHOP_SANDBOX_COMPANY_ID: biz_4To0HUTEuAbKkl
          WHOP_SANDBOX_PRODUCT_ID: prod_b7Vm6yYS2ROI6
          WHOP_SANDBOX_PRO_PLAN_ID: plan_ECWULjIBMFBE5
          WHOP_SANDBOX_PREMIUM_PLAN_ID: plan_YCBJ6FvCkKuRv
          CANCEL_DUPLICATE_MEMBERSHIP: ${{ github.event.inputs.cancel_duplicate_membership }}
        run: node scripts/verify-whop-sandbox-post-payment.cjs

      - name: Audit Whop QA user variables
        if: github.event.inputs.mode == 'audit_qa_vars'
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/sync_whop_qa_user_variable.cjs audit

      - name: Repair Whop QA user variables
        if: github.event.inputs.mode == 'repair_qa_vars'
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/sync_whop_qa_user_variable.cjs repair

      - name: Dump billing-checkout execution logs on failure
        if: always() && github.event.inputs.mode == 'full_e2e'
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/dump_billing_checkout_executions.cjs

      - name: Restore previous Whop QA user variable
        if: always() && steps.sync_qa_vars.outcome != 'skipped' && steps.sync_qa_vars.outcome != null
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          TARGET_QA_USER_ID: ${{ steps.provision.outputs.qa_user_id }}
        run: node scripts/sync_whop_qa_user_variable.cjs restore
