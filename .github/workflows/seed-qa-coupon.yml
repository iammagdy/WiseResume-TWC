name: Seed Production QA Coupon

on:
  workflow_dispatch:
    inputs:
      coupon_code:
        description: 'Single-use Production QA coupon code (must start with QA_)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seed-qa-coupon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest

    steps:
      - name: Guard against non-main branch execution
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "[FATAL] seed-qa-coupon workflow can ONLY be executed from refs/heads/main. Current ref: ${{ github.ref }}"
            exit 1
          fi

      - name: Checkout repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Verify HEAD matches origin/main
        run: |
          git fetch origin main --depth=1
          CURRENT_HEAD=$(git rev-parse HEAD)
          ORIGIN_MAIN=$(git rev-parse origin/main)
          if [ "$CURRENT_HEAD" != "$ORIGIN_MAIN" ]; then
            echo "[FATAL] Workflow HEAD ($CURRENT_HEAD) does not match origin/main ($ORIGIN_MAIN). Execution blocked."
            exit 1
          fi
          echo "[PASS] Verified HEAD matches origin/main ($CURRENT_HEAD)"

      - name: Setup Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Mask Coupon Code
        run: |
          RAW_CODE="${{ inputs.coupon_code }}"
          echo "::add-mask::$RAW_CODE"
          echo "[seed-qa-coupon] QA coupon code registered and masked."

      - name: Execute QA Coupon Seed
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          QA_COUPON_CODE: ${{ inputs.coupon_code }}
        run: node scripts/seed_qa_coupon.cjs
