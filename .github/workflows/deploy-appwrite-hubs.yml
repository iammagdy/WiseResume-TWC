name: Deploy Appwrite Hubs

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Required comma-separated hub ids; broad/all deployment is intentionally disabled'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-appwrite-hubs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2

      - name: Setup Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate explicit hub targets
        id: targets
        run: node scripts/validate-hub-targets.cjs "${{ inputs.target }}"

      - name: Recompute hub source hashes
        run: node scripts/compute-source-hashes.mjs

      - name: Ensure source hash manifest is committed
        run: git diff --exit-code -- src/lib/devkit/sourceHashes.generated.json

      - name: Ensure AI runtime receipts schema
        if: ${{ contains(fromJSON(steps.targets.outputs.targets_json), 'admin-devkit-data') || contains(fromJSON(steps.targets.outputs.targets_json), 'ai-gateway') || contains(fromJSON(steps.targets.outputs.targets_json), 'job-import') || contains(fromJSON(steps.targets.outputs.targets_json), 'resume-section-ai') }}
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/setup_ai_runtime_receipts_schema.cjs

      - name: Ensure app settings schema
        if: ${{ contains(fromJSON(steps.targets.outputs.targets_json), 'inspect-ai-keys') }}
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/setup_app_settings_schema.cjs

      - name: Ensure RevenueCat provider-state schema
        if: ${{ contains(fromJSON(steps.targets.outputs.targets_json), 'revenuecat-webhook') }}
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/setup_revenuecat_schema.cjs

      - name: Validate PayPal Sandbox bootstrap configuration
        if: ${{ contains(fromJSON(steps.targets.outputs.targets_json), 'paypal-webhook') }}
        env:
          PAYPAL_ACCESS_ENVIRONMENT: sandbox
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_SANDBOX_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_SANDBOX_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_SANDBOX_WEBHOOK_ID || vars.PAYPAL_SANDBOX_WEBHOOK_ID }}
          BILLING_CHECKOUT_QA_USER_ID: ${{ secrets.BILLING_CHECKOUT_QA_USER_ID || vars.BILLING_CHECKOUT_QA_USER_ID }}
        run: node scripts/validate_paypal_bootstrap.cjs

      - name: Ensure PayPal subscription schema
        if: ${{ contains(fromJSON(steps.targets.outputs.targets_json), 'paypal-webhook') }}
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/setup_paypal_schema.cjs

      - name: Ensure coupon security schema
        if: ${{ contains(fromJSON(steps.targets.outputs.targets_json), 'coupons') || contains(fromJSON(steps.targets.outputs.targets_json), 'admin-devkit-data') }}
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/setup_discount_codes_schema.cjs

      - name: Ensure broadcasts schema
        if: ${{ contains(fromJSON(steps.targets.outputs.targets_json), 'admin-devkit-data') }}
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/setup_broadcasts_schema.cjs

      - name: Ensure impersonation sessions schema
        if: ${{ contains(fromJSON(steps.targets.outputs.targets_json), 'admin-devkit-data') || contains(fromJSON(steps.targets.outputs.targets_json), 'admin-impersonate') }}
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/setup_impersonation_sessions_schema.cjs

      - name: Ensure remote jobs feed schema
        if: ${{ contains(fromJSON(steps.targets.outputs.targets_json), 'job-feed-sync') || contains(fromJSON(steps.targets.outputs.targets_json), 'get-remote-jobs') || contains(fromJSON(steps.targets.outputs.targets_json), 'track-job-action') }}
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/setup_remote_jobs_feed_schema.cjs

      - name: Ensure public-audit security schema
        if: ${{ contains(fromJSON(steps.targets.outputs.targets_json), 'ai-gateway') || contains(fromJSON(steps.targets.outputs.targets_json), 'email-service') || contains(fromJSON(steps.targets.outputs.targets_json), 'admin-devkit-data') }}
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/setup-security-collections.cjs

      - name: Deploy explicitly selected Appwrite hubs
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          OPENROUTER_KEY_1: ${{ secrets.OPENROUTER_KEY_1 }}
          OPENROUTER_KEY_2: ${{ secrets.OPENROUTER_KEY_2 }}
          OPENROUTER_KEY_3: ${{ secrets.OPENROUTER_KEY_3 }}
          GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          NVIDIA_KEY_1: ${{ secrets.NVIDIA_KEY_1 }}
          NVIDIA_KEY_2: ${{ secrets.NVIDIA_KEY_2 }}
          NVIDIA_KEY_3: ${{ secrets.NVIDIA_KEY_3 }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ secrets.DD_SITE }}
          DEVKIT_PASSWORD: ${{ secrets.DEVKIT_PASSWORD }}
          IMPERSONATION_HMAC_SECRET: ${{ secrets.IMPERSONATION_HMAC_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          PUBLIC_SHARE_TOKEN_SECRET: ${{ secrets.PUBLIC_SHARE_TOKEN_SECRET }}
          GATEWAY_SMOKE_SECRET: ${{ secrets.GATEWAY_SMOKE_SECRET }}
          ADMIN_TEST_HMAC_SECRET: ${{ secrets.ADMIN_TEST_HMAC_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME }}
          RESEND_SEGMENT_ALL_USERS: ${{ secrets.RESEND_SEGMENT_ALL_USERS }}
          RESEND_AUDIENCE_ALL_USERS: ${{ secrets.RESEND_AUDIENCE_ALL_USERS }}
          GITHUB_TOKEN: ${{ secrets.DEPLOY_GITHUB_TOKEN }}
          GITHUB_REPO: iammagdy/WiseResume-TWC
          FRONTEND_URL: https://wiseresume.app
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_ORG_SLUG: ${{ secrets.SENTRY_ORG_SLUG }}
          SENTRY_PROJECT_SLUG: ${{ secrets.SENTRY_PROJECT_SLUG }}
          SENTRY_WEBHOOK_SECRET: ${{ secrets.SENTRY_WEBHOOK_SECRET }}
          JINA_READER_API_KEY: ${{ secrets.JINA_READER_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          PORTFOLIO_JWT_SECRET: ${{ secrets.PORTFOLIO_JWT_SECRET }}
          PASSWORD_RESET_OTP_SECRET: ${{ secrets.PASSWORD_RESET_OTP_SECRET }}
          REVENUECAT_WEBHOOK_AUTH_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_AUTH_SECRET }}
          BILLING_SANDBOX_PADDLE_API_KEY: ${{ secrets.BILLING_SANDBOX_PADDLE_API_KEY }}
          BILLING_PRODUCTION_PADDLE_API_KEY: ${{ secrets.BILLING_PRODUCTION_PADDLE_API_KEY }}
          BILLING_PRODUCTION_PRO_PRICE_ID: pri_01m192gqtw1cxrkctafjcahmfe
          BILLING_PRODUCTION_PRO_PRODUCT_ID: pro_01m1924dqce7nd69khnakxftzw
          BILLING_PRODUCTION_PREMIUM_PRICE_ID: pri_01m192m6bwzvarmcr05c78by7r
          BILLING_PRODUCTION_PREMIUM_PRODUCT_ID: pro_01m192jr9nzd6k5ysa6yhk5aq7
          PAYPAL_ACCESS_ENVIRONMENT: sandbox
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_SANDBOX_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_SANDBOX_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_SANDBOX_WEBHOOK_ID || vars.PAYPAL_SANDBOX_WEBHOOK_ID }}
          BILLING_CHECKOUT_QA_USER_ID: ${{ secrets.BILLING_CHECKOUT_QA_USER_ID || vars.BILLING_CHECKOUT_QA_USER_ID }}
          BILLING_CHECKOUT_PROVIDER: ${{ secrets.BILLING_CHECKOUT_PROVIDER || vars.BILLING_CHECKOUT_PROVIDER || 'paypal' }}
          PAYPAL_PRO_PLAN_ID: ${{ secrets.PAYPAL_PRO_PLAN_ID || vars.PAYPAL_PRO_PLAN_ID }}
          PAYPAL_PREMIUM_PLAN_ID: ${{ secrets.PAYPAL_PREMIUM_PLAN_ID || vars.PAYPAL_PREMIUM_PLAN_ID }}
          BILLING_CHECKOUT_RETURN_URL: https://wiseresume.app/subscription?billing=success
          BILLING_CHECKOUT_CANCEL_URL: https://wiseresume.app/subscription?billing=canceled
          HUB_TARGET: ${{ steps.targets.outputs.targets_csv }}
        run: node scripts/deploy_hubs.cjs --only="${HUB_TARGET}"

      - name: Trigger remote job feed sync
        if: ${{ contains(fromJSON(steps.targets.outputs.targets_json), 'job-feed-sync') }}
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 69fd362b001eb325a192
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/trigger-sync.cjs
