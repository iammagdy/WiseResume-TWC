name: Security validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'appwrite-hubs/**'
      - 'api/**'
      - 'server/**'
      - 'src/lib/security/**'
      - 'src/contexts/AuthContext*'
      - '.github/workflows/**'
      - 'scripts/deploy*'
      - 'scripts/setup*'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-suite:
    name: Security regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run security regression suite
        run: npx vitest run src/lib/security
